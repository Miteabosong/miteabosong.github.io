<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Tea — Gọi nước tận nơi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lobster&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7efe3; --card:#fffaf2; --ink:#3a1714; --muted:#7d6a64;
    --brand:#7a1f1c; --brand-2:#f3e1d6; --accent:#c0602a; --line:#ead9c6;
    --ok:#2f7a4a; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
  html{touch-action:manipulation}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}
  header.hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px;background:#f7b6c8;text-align:center;max-width:560px;margin:0 auto}
  .heroArt{display:block;width:100%;height:auto;aspect-ratio:4/3}
  .heroText{position:absolute;top:16px;left:0;right:0;padding:0 16px}
  .hero h1{margin:0;font-family:"Lobster",cursive;font-weight:400;font-size:52px;line-height:1.05;color:#7a1f1c;text-shadow:0 2px 0 rgba(255,255,255,.6)}
  .hero p{display:inline-block;margin:6px auto 0;font-size:13px;font-weight:600;color:#7a1f1c;background:rgba(255,255,255,.6);padding:6px 12px;border-radius:14px;line-height:1.45}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;white-space:nowrap;font-size:14px;font-weight:600;color:var(--muted)}
  .tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  h2.cat{font-size:17px;margin:20px 2px 8px;color:var(--brand);font-weight:800;letter-spacing:.02em;text-transform:uppercase}
  .item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
  .emo{width:50px;height:50px;border-radius:14px;background:var(--brand-2);display:grid;place-items:center;font-size:26px;flex:none}
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:15px}
  .info span{font-size:13px;color:var(--muted)}
  .price{font-weight:700;color:var(--brand);font-size:14px;margin-top:2px}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:34px;height:34px;border-radius:50%;border:none;font-size:20px;line-height:1;display:grid;place-items:center}
  .minus{background:#efe2d2}
  .plus{background:var(--accent);color:#fff!important}
  .qty output{min-width:18px;text-align:center;font-weight:700}
  .count{background:var(--brand);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:2px 8px}
  .sold{opacity:.45}
  .cartbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:10}
  .cartbtn{max-width:528px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--brand);color:#fff!important;border:none;border-radius:16px;padding:16px 18px;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(58,23,20,.25)}
  .cartbtn[disabled]{opacity:.35}
  .badge{background:var(--accent);border-radius:999px;padding:2px 9px;margin-right:8px;font-size:14px}
  .shade{position:fixed;inset:0;background:rgba(40,15,12,.45);z-index:20;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;z-index:21;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
  .sheet:not(.open){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  .sheet.open{transform:none}
  .sheet .in{max-width:528px;margin:0 auto}
  .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 14px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
  .row .qty button{width:28px;height:28px;font-size:16px}
  .total{font-size:18px;font-weight:800;border:none;padding-top:12px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:var(--muted)}
  input,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  textarea{min-height:64px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}
  .chip.on{background:var(--brand-2);border-color:var(--brand);color:var(--brand);font-weight:600}
  .opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;font-size:15px;font-weight:600}
  .opt i{font-style:normal;color:var(--accent);font-size:22px}
  .primary{width:100%;margin-top:18px;background:var(--accent);color:#fff!important;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px}
  .primary[disabled]{opacity:.5}
  .err{color:#b3261e;font-size:13px;margin-top:8px;min-height:1em}
  .done{text-align:center;padding:14px 4px}
  .done .big{font-size:58px}
  .done h3{margin:6px 0 4px;font-size:22px}
  .code{display:inline-block;margin:8px 0;background:var(--brand-2);color:var(--brand);font-weight:800;font-size:26px;letter-spacing:.1em;border-radius:12px;padding:6px 16px}
  .bank{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
  .bank img{width:100%;max-width:260px;display:block;margin:0 auto}
  .bank p{margin:6px 0 0;font-size:14px}
  .copy{border:1px solid var(--line);background:var(--brand-2);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;margin-left:6px}
  .staff header{display:flex;justify-content:space-between;align-items:center;padding:18px 0 6px}
  .staff h1{font-size:22px;margin:0}
  .pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:#efe2d2}
  .order{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:16px;padding:14px;margin:10px 0}
  .order.making{border-left-color:var(--brand)}
  .order.served{border-left-color:var(--ok);opacity:.6}
  .order .top{display:flex;justify-content:space-between;align-items:baseline}
  .order .top b{font-size:18px}
  .order ul{margin:8px 0;padding-left:18px}
  .order .meta{font-size:13px;color:var(--muted)}
  .actions{display:flex;gap:8px;margin-top:10px}
  .actions button{flex:1;border:none;border-radius:12px;padding:11px;font-weight:700}
  .b-make{background:var(--brand);color:#fff!important}
  .b-serve{background:var(--ok);color:#fff!important}
  .b-ghost{background:#efe2d2}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
  .panel h3{margin:0 0 6px;font-size:16px}
  .panel p{font-size:14px;color:var(--muted);line-height:1.5}
  .qrcard{background:#fff0f5;border-radius:20px;padding:18px;text-align:center;border:3px solid #e75a8d;margin-top:12px}
  .qrcard #qr{display:inline-block;padding:10px;background:#fff;border-radius:12px}
  .qrcard h4{margin:0 0 4px;font-family:"Lobster",cursive;font-weight:400;font-size:40px;color:#d63c74}
  .qrcard p{margin:6px 0 0;color:#a3285a;font-weight:600}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .link{background:none;border:none;color:var(--brand)!important;font-weight:700;text-decoration:underline;padding:0}
  .hide{display:none!important}
  #lastBanner{display:block;width:100%;margin-top:12px;border:1px solid #e75a8d;background:#fff0f5;color:#a3285a;border-radius:14px;padding:10px 12px;font-size:14px;text-align:center}
  #waiting{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none;padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
  #waiting.show{display:block;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .wIn{max-width:460px;margin:0 auto;text-align:center}
  .cupAnim{font-size:64px;display:inline-block;position:relative;animation:bob 1.6s ease-in-out infinite}
  .cupAnim .steam{position:absolute;right:-18px;top:-6px;font-size:22px;animation:tw 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
  @keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
  .wLabel{margin:10px 0 0;color:var(--muted);font-weight:600;font-size:14px}
  .wNum{font-size:84px;font-weight:800;line-height:1;color:#d63c74;background:#fff0f5;border:3px solid #e75a8d;border-radius:24px;display:inline-block;min-width:150px;padding:10px 22px;margin:8px 0 14px}
  #waiting h2{margin:0 0 6px;font-size:22px;color:var(--brand)}
  .wSub{margin:0 0 18px;color:var(--muted);line-height:1.5}
  .steps{display:flex;align-items:center;gap:6px;margin:0 0 18px;font-size:12px;font-weight:700}
  .steps .st{padding:6px 10px;border-radius:999px;background:#efe2d2;color:var(--muted);white-space:nowrap}
  .steps .st.done{background:var(--ok);color:#fff}
  .steps .st.now{background:var(--accent);color:#fff;animation:tw 1.4s ease-in-out infinite}
  .steps .bar{flex:1;height:4px;border-radius:4px;background:#efe2d2;overflow:hidden;position:relative}
  .steps .bar i{position:absolute;inset:0;width:40%;background:var(--accent);border-radius:4px;animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{from{left:-40%}to{left:100%}}
  .wBox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 14px 12px;text-align:left}
</style>
</head>

const fmt = n => n.toLocaleString("vi-VN") + "đ";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LIVE = !!(CONFIG.telegramToken && CONFIG.telegramChatId);
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} },
};

/* ---------- Giỏ hàng: key = tên dòng, mỗi dòng có giá ---------- */
const cart = {};   // lineName -> {qty, price, ref}
const items = {};  // "ci-ii" -> item
CONFIG.menu.forEach((c, ci) => c.items.forEach((it, ii) => { it.noTop = !!c.noTop; items[ci + "-" + ii] = it; }));

function countFor(ref){ let n = 0; for (const k in cart) if (cart[k].ref === ref) n += cart[k].qty; return n; }

function renderMenu(){
  const tabs = document.getElementById("tabs");
  if (!tabs.children.length)
    tabs.innerHTML = CONFIG.menu.map((c, ci) => `<button class="tab ${ci===0?"on":""}" onclick="jump(${ci})">${esc(c.cat)}</button>`).join("");
  document.getElementById("menu").innerHTML = CONFIG.menu.map((c, ci) => `
    <section id="cat${ci}">
      <h2 class="cat">${esc(c.cat)}</h2>
      ${c.items.map((it, ii) => {
        const ref = ci + "-" + ii, n = countFor(ref);
        let ctrl;
        if (it.soldOut) ctrl = "";
        else if (it.opts || !it.noTop) ctrl = `<div class="qty">${n ? `<span class="count">${n}</span>` : ""}<button class="plus" onclick="pickOpt('${ref}')" aria-label="Thêm">+</button></div>`;
        else ctrl = `<div class="qty">
            <button class="minus ${n?"":"hide"}" onclick="addLine('${ref}',null,-1)" aria-label="Bớt">−</button>
            <output class="${n?"":"hide"}">${n}</output>
            <button class="plus" onclick="addLine('${ref}',null,1)" aria-label="Thêm">+</button></div>`;
        return `<div class="item ${it.soldOut?"sold":""}">
          <div class="emo">${it.emo || "🥤"}</div>
          <div class="info"><b>${esc(it.name)}</b>${(it.soldOut || it.desc) ? `<span>${esc(it.soldOut ? "Tạm hết" : it.desc)}</span>` : ""}
            <div class="price">${fmt(it.price)}</div></div>${ctrl}</div>`;
      }).join("")}
    </section>`).join("");
}
function jump(ci){
  document.querySelectorAll(".tab").forEach((t,i)=>t.classList.toggle("on", i===ci));
  const el = document.getElementById("cat"+ci);
  window.scrollTo({ top: el.offsetTop - 64, behavior: "smooth" });
  document.querySelectorAll(".tab")[ci].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}
function addLine(ref, opt, d){
  const it = items[ref], name = opt || it.name;
  const cur = cart[name] || { qty: 0, price: it.price, ref };
  cur.qty = Math.max(0, cur.qty + d);
  if (cur.qty) cart[name] = cur; else delete cart[name];
  renderMenu(); updateBar();
}
let cz = null;
function pickOpt(ref){
  const it = items[ref];
  cz = { ref, opt: it.opts && it.opts.length === 1 ? 0 : (it.opts ? -1 : null), tops: new Set(), qty: 1 };
  renderCz();
}
function renderCz(){
  const it = items[cz.ref];
  const unit = it.price + [...cz.tops].reduce((s, i) => s + CONFIG.toppings[i].price, 0);
  openSheetWith(`<div class="grab"></div>
    <h3 style="margin:0 0 2px">${esc(it.name)}</h3>
    <p style="margin:0 0 6px;color:var(--muted);font-size:14px">${fmt(it.price)}</p>
    ${it.opts ? `<label>Chọn vị *</label><div class="chips">${it.opts.map((o,i)=>`<button class="chip ${cz.opt===i?"on":""}" onclick="cz.opt=${i};renderCz()">${esc(o)}</button>`).join("")}</div>` : ""}
    ${it.noTop ? "" : `<label>Thêm topping (không bắt buộc)</label><div class="chips">${CONFIG.toppings.map((t,i)=>`<button class="chip ${cz.tops.has(i)?"on":""}" onclick="cz.tops.has(${i})?cz.tops.delete(${i}):cz.tops.add(${i});renderCz()">${cz.tops.has(i)?"✓ ":""}${esc(t.name)} +${t.price/1000}k</button>`).join("")}</div>`}
    <label>Số lượng</label>
    <div class="qty"><button class="minus" onclick="cz.qty=Math.max(1,cz.qty-1);renderCz()">−</button><output>${cz.qty}</output><button class="plus" onclick="cz.qty++;renderCz()">+</button></div>
    <button class="primary" onclick="confirmCz()">Thêm vào đơn · ${fmt(unit * cz.qty)}</button>
    <div class="err" id="czErr"></div>`);
}
function confirmCz(){
  const it = items[cz.ref];
  if (it.opts && cz.opt < 0){ document.getElementById("czErr").textContent = "Bạn chọn vị giúp quán nhé."; return; }
  const base = it.opts ? it.opts[cz.opt] : it.name;
  const tops = [...cz.tops].sort((a,b)=>a-b).map(i => CONFIG.toppings[i]);
  const name = base + (tops.length ? " + " + tops.map(t => t.name.toLowerCase()).join(", ") : "");
  const price = it.price + tops.reduce((s, t) => s + t.price, 0);
  const cur = cart[name] || { qty: 0, price, ref: cz.ref };
  cur.qty += cz.qty; cart[name] = cur;
  renderMenu(); updateBar(); closeSheet(); toast("Đã thêm " + cz.qty + " " + base);
}
function totals(){ let n = 0, sum = 0; for (const k in cart){ n += cart[k].qty; sum += cart[k].qty * cart[k].price; } return { n, sum }; }
function updateBar(){
  const { n, sum } = totals();
  document.getElementById("cartCount").textContent = n;
  document.getElementById("cartTotal").textContent = fmt(sum);
  document.getElementById("cartBtn").disabled = n === 0;
}
function toast(msg){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;transition:opacity .3s";
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(()=>t.style.opacity = 0, 1400);
}

function openSheetWith(html){
  document.getElementById("sheetIn").innerHTML = html;
  document.getElementById("shade").style.display = "block";
  requestAnimationFrame(()=>document.getElementById("sheet").classList.add("open"));
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.getElementById("shade").style.display = "none";
}

let notes = new Set(), pay = "Tiền mặt";
function cartRows(){
  const keys = Object.keys(cart);
  if (!keys.length) return `<p style="color:var(--muted)">Chưa có món nào.</p>`;
  return keys.map(k => `<div class="row"><span style="flex:1">${esc(k)}<br><small style="color:var(--muted)">${fmt(cart[k].price)}</small></span>
    <div class="qty"><button class="minus" onclick="bump('${esc(k)}',-1)">−</button><output>${cart[k].qty}</output><button class="plus" onclick="bump('${esc(k)}',1)">+</button></div></div>`).join("");
}
function bump(name, d){
  const c = cart[name]; if (!c) return;
  c.qty += d; if (c.qty <= 0) delete cart[name];
  renderMenu(); updateBar();
  document.getElementById("cartRows").innerHTML = cartRows();
  document.getElementById("sumRow").textContent = fmt(totals().sum);
  drawBank();
  if (!totals().n) closeSheet();
}
function openCart(){
  const saved = store.get("khach", {});
  openSheetWith(`
    <div class="grab"></div>
    <h3 style="margin:0 0 6px">Đơn của bạn</h3>
    <div id="cartRows">${cartRows()}</div>
    <div class="row total"><span>Tổng</span><span id="sumRow">${fmt(totals().sum)}</span></div>
    <label>Tên hoặc SĐT (để quán gọi khi mang qua)</label>
    <input id="fName" placeholder="VD: Anh Minh – 09xx" value="${esc(saved.name||"")}">
    <label>Ghi chú nhanh</label>
    <div class="chips">${CONFIG.quickNotes.map(q=>`<button class="chip ${notes.has(q)?"on":""}" onclick="toggleNote(this,'${esc(q)}')">${esc(q)}</button>`).join("")}</div>
    <textarea id="fNote" placeholder="Ghi chú thêm (VD: 1 ly ít ngọt, 1 ly bình thường)" style="margin-top:8px"></textarea>
    <label>Thanh toán</label>
    <div class="chips" id="payChips">
      <button class="chip ${pay==="Tiền mặt"?"on":""}" data-p="Tiền mặt" onclick="pickPay(this)">💵 Tiền mặt khi nhận</button>
      <button class="chip ${pay==="Chuyển khoản"?"on":""}" data-p="Chuyển khoản" onclick="pickPay(this)">🏦 Chuyển khoản</button>
    </div>
    <div id="bankWrap">${pay === "Chuyển khoản" ? "" : ""}</div>
    <button class="primary" id="sendBtn" onclick="submitOrder()">Gửi đơn cho quán</button>
    <div class="err" id="err"></div>`);
  drawBank();
}
function toggleNote(el, q){ notes.has(q) ? notes.delete(q) : notes.add(q); el.classList.toggle("on"); }
function pickPay(el){ pay = el.dataset.p; document.querySelectorAll("#payChips .chip").forEach(c=>c.classList.toggle("on", c===el)); drawBank(); }
function drawBank(){
  const w = document.getElementById("bankWrap"); if (!w) return;
  w.innerHTML = pay === "Chuyển khoản" ? bankBox({ total: totals().sum, name: (document.getElementById("fName")||{}).value }) + `<p style="font-size:13px;color:var(--muted);margin:8px 2px 0">Chuyển khoản xong bấm <b>Gửi đơn cho quán</b> bên dưới nhé.</p>` : "";
}

async function submitOrder(){
  const err = document.getElementById("err");
  const name = document.getElementById("fName").value.trim();
  const extra = document.getElementById("fNote").value.trim();
  const order = {
    id: Date.now(),
    num: 0,
    time: new Date().toLocaleTimeString("vi-VN", {hour:"2-digit", minute:"2-digit"}),
    lines: Object.keys(cart).map(k => ({ name: k, qty: cart[k].qty, price: cart[k].price })),
    total: totals().sum, name, pay,
    note: [...notes, extra].filter(Boolean).join(", "),
    status: "new",
  };
  store.set("khach", { name });
  const btn = document.getElementById("sendBtn");
  btn.disabled = true; btn.textContent = "Đang gửi…"; err.textContent = "";
  try{
    if (LIVE){ await sendTelegram(order); callOwner(order); }
    else { order.num = (store.get("demoNum", 0) || 0) + 1; store.set("demoNum", order.num); }
    showDone(order);
  }catch(e){
    btn.disabled = false; btn.textContent = "Gửi lại";
    err.textContent = "Chưa gửi được (mạng yếu?). Bạn thử lại, hoặc vẫy tay gọi quán nhé 👋";
  }
}
function orderText(o){
  return `🔔 ${o.num ? "ĐƠN SỐ " + o.num : "ĐƠN MỚI"} — ${o.time}
${o.name ? "👤 " + o.name : "👤 (khách không ghi tên)"}

${o.lines.map(l => `• ${l.qty} × ${l.name}`).join("\n")}
${o.note ? "\n📝 " + o.note + "\n" : ""}
💰 ${fmt(o.total)} — ${o.pay}`;
}
async function sendTelegram(o){
  const body = new URLSearchParams({ chat_id: CONFIG.telegramChatId, text: orderText(o) });
  const api = m => `https://api.telegram.org/bot${CONFIG.telegramToken}/${m}`;
  const r = await fetch(api("sendMessage"), { method: "POST", body });
  if (!r.ok) throw new Error("telegram " + r.status);
  // Số đơn = số thứ tự tin nhắn Telegram (tăng dần, không trùng)
  try{
    const j = await r.json(); o.num = j.result.message_id;
    fetch(api("editMessageText"), { method: "POST", body: new URLSearchParams({ chat_id: CONFIG.telegramChatId, message_id: o.num, text: orderText(o) }) }).catch(()=>{});
  }catch{ o.num = 0; }
}
function callOwner(o){
  if (!CONFIG.callUser) return;
  const say = (o.num ? `Đơn số ${o.num}. ` : "Có đơn mới. ") + o.lines.map(l => `${l.qty} ${l.name}`).join(", ") + ".";
  const url = "https://api.callmebot.com/start.php?" + new URLSearchParams({
    user: CONFIG.callUser, text: say, lang: "vi-VN-Standard-A", rpt: "2", cc: "no",
  });
  fetch(url, { mode: "no-cors" }).catch(()=>{});   // không chặn khách nếu cuộc gọi lỗi
}
function bankBox(o){
  const b = CONFIG.bank, nm = (o.name || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9 ]/g, "").trim().slice(0, 20), memo = ("MITEA " + nm).trim();
  const dyn = `https://img.vietqr.io/image/${b.code}-${b.account}-compact2.png?` + new URLSearchParams({ amount: o.total, addInfo: memo, accountName: b.holder });
  return `<div class="bank">
    <img src="${dyn}" alt="Mã QR chuyển khoản" onerror="this.onerror=null;this.src=BANK_QR_IMG">
    <p><b>${esc(b.name)}</b> · ${esc(b.holder)}</p>
    <p>STK: <b>${esc(b.account)}</b> <button class="copy" onclick="copyTxt('${b.account}',this)">Chép</button></p>
    <p>Số tiền: <b>${fmt(o.total)}</b> · Nội dung: <b>${memo}</b> <button class="copy" onclick="copyTxt('${memo}',this)">Chép</button></p>
    <p style="color:var(--muted);font-size:12px">Mở app ngân hàng → quét mã (hoặc chụp màn hình rồi chọn ảnh). Quán kiểm tra khi mang nước qua.</p>
  </div>`;
}
async function copyTxt(t, el){ try{ await navigator.clipboard.writeText(t); el.textContent = "Đã chép"; }catch{ el.textContent = "Giữ để chép"; } }
function showDone(o){
  Object.keys(cart).forEach(k => delete cart[k]); notes = new Set();
  renderMenu(); updateBar(); closeSheet();
  store.set("lastOrder", { ...o, at: Date.now() });
  showWaiting(o);
}
function showWaiting(o){
  const w = document.getElementById("waiting");
  w.innerHTML = `
    <div class="wIn">
      <div class="cupAnim">🧋<span class="steam">✨</span></div>
      <p class="wLabel">Số đơn của bạn</p>
      <div class="wNum">${o.num ? o.num : "✓"}</div>
      <h2>Quán đang pha món cho bạn</h2>
      <p class="wSub">Pha xong quán mang qua và gọi <b>số ${o.num || "đơn"}</b>.<br>Bạn cứ ngồi ngắm sông nhé 🌊</p>
      <div class="steps">
        <div class="st done">✓ Đã gửi đơn</div><div class="bar"><i></i></div>
        <div class="st now">Đang pha</div><div class="bar"></div>
        <div class="st">Mang qua</div>
      </div>
      <div class="wBox">
        ${o.lines.map(l => `<div class="row"><span>${l.qty} × ${esc(l.name)}</span><span>${fmt(l.qty*l.price)}</span></div>`).join("")}
        ${o.note ? `<p style="font-size:13px;color:var(--muted);margin:8px 0 0">📝 ${esc(o.note)}</p>` : ""}
        <div class="row total"><span>Tổng</span><span>${fmt(o.total)}</span></div>
        <p style="margin:2px 0 0;font-size:14px;color:var(--muted)">${o.pay === "Chuyển khoản" ? "🏦 Chuyển khoản" : "💵 Trả tiền mặt khi nhận"}</p>
      </div>
      <button class="primary" onclick="hideWaiting()">Gọi thêm món</button>
    </div>`;
  w.classList.add("show"); window.scrollTo(0,0);
}
function hideWaiting(){ document.getElementById("waiting").classList.remove("show"); renderBanner(); }
function renderBanner(){
  const lo = store.get("lastOrder", null), el = document.getElementById("lastBanner");
  if (lo && lo.num && Date.now() - lo.at < 45*60*1000){
    el.innerHTML = `🧋 Đơn số <b>${lo.num}</b> của bạn đang được pha · <u>Xem</u>`;
    el.onclick = () => showWaiting(lo); el.classList.remove("hide");
  } else el.classList.add("hide");
}
renderBanner();

renderMenu(); updateBar();
</script>
</body>
</html>
